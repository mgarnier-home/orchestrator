name: monitoring

services:
  docker-socket-proxy:
    image: docker.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
    ports:
      - ${APOLLON_DOCKER_SOCKET_PROXY_PORT}:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: wget -q --spider --timeout=5 --tries=1 http://localhost:2375/_ping || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  telegraf:
    image: docker.io/telegraf:1.40.2@sha256:3992a56245a9477dfad5b98d9354d3ea7c1bced0aab6630ba49f23ac9a4d269e
    container_name: telegraf
    restart: unless-stopped
    command: ["--config", "/config/apollon.conf"]
    network_mode: host # required for host-level metrics
    user: telegraf:994 # required for docker socket access, got from : stat -c '%g' /var/run/docker.sock
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: monitoring/telegraf
        target: /config
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
    healthcheck:
      test: wget -q --spider --timeout=5 --tries=1 http://localhost:8080 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

    environment:
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
      HOST_ETC: /hostfs/etc
      HOST_MOUNT_PREFIX: /hostfs
      INFLUX_URL: "http://${ATLAS_IP}:${ATLAS_INFLUXDB_PORT}"
      INFLUX_TOKEN: ${INFLUXDB_TOKEN}
      INFLUX_ORG: ${INFLUXDB_ORG}
      INFLUX_BUCKET: ${INFLUXDB_BUCKET}

  dozzle-agent:
    image: docker.io/amir20/dozzle:v10.10.0@sha256:2875e3c1f31f2244ee99d6067b53852b30666b3e2fb293d179bc8be94b1da5eb
    container_name: dozzle-agent
    restart: unless-stopped
    command: agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - ${APOLLON_DOZZLE_AGENT_PORT}:7007

  vector:
    image: docker.io/timberio/vector:0.61.0-debian@sha256:f6c23b5a7e16fb2838d33619ef7acf4bad2289a7cf22bc90efc2371f520c4ea2
    container_name: vector
    restart: unless-stopped
    user: root:root # required for docker socket access; replace root:root with vector:<docker-gid> for least-privilege
    command: ["--config", "/config/vector.toml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: volume
        source: docker-data
        volume:
          subpath: monitoring/vector
        target: /config
    environment:
      HOST_NAME: ${APOLLON_HOSTNAME}
      OPENOBSERVE_HOST: ${ATLAS_IP}
      OPENOBSERVE_PORT: ${ATLAS_OPENOBSERVE_PORT}
      OPENOBSERVE_ROOT_EMAIL: ${OPENOBSERVE_ROOT_EMAIL}
      OPENOBSERVE_ROOT_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD}
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true" # vector >= 0.57 no longer interpolates ${VAR} in config by default
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          bash -c 'exec 3<>/dev/tcp/localhost/8686 &&
          echo -e "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          head -n 1 <&3 | grep -q "200"' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # Page d'accueil du homelab (repo mgarnier-home/homepage). Image distroless, sans shell ni curl :
  # pas de healthcheck possible.
  dashboard:
    image: docker.io/mgarnier11/homepage:1.5.0@sha256:911a2dfa1f26aa77d6049d9f6ebe57f87f04664532b2c37e6bf1fe856975a99b
    container_name: dashboard
    restart: unless-stopped
    ports:
      - ${APOLLON_DASHBOARD_PORT}:8080
    environment:
      HOMEPAGE_DOCKER_HOSTS: apollon=http://${APOLLON_IP}:${APOLLON_DOCKER_SOCKET_PROXY_PORT},atlas=http://${ATLAS_IP}:${ATLAS_DOCKER_SOCKET_PROXY_PORT},zephyr=http://${ZEPHYR_IP}:${ZEPHYR_DOCKER_SOCKET_PROXY_PORT},athena=http://${ATHENA_IP}:${ATHENA_DOCKER_SOCKET_PROXY_PORT}
      HOMEPAGE_PUBLIC_DOMAIN: ${PUBLIC_DOMAIN_NAME}
      HOMEPAGE_STATUS_URLS: ${PUBLIC_DOMAIN_NAME}=https://status.${PUBLIC_DOMAIN_NAME}/,les-potixx.fr=https://les-potixx.fr/__homepage-status,epsilon44.fr=https://epsilon44.fr/__homepage-status,epsilon44.fr=https://www.epsilon44.fr/__homepage-status
      INFLUX_URL: http://${ATLAS_IP}:${ATLAS_INFLUXDB_PORT}
      INFLUX_TOKEN: ${INFLUXDB_TOKEN}
      INFLUX_ORG: ${INFLUXDB_ORG}
      INFLUX_BUCKET: ${INFLUXDB_BUCKET}
      HOMEPAGE_STATS_JELLYFIN_API_KEY: ${HOMEPAGE_STATS_JELLYFIN_API_KEY}
      HOMEPAGE_STATS_NAVIDROME_MUSIC_USER: ${HOMEPAGE_STATS_NAVIDROME_MUSIC_USER}
      HOMEPAGE_STATS_NAVIDROME_MUSIC_PASSWORD: ${HOMEPAGE_STATS_NAVIDROME_MUSIC_PASSWORD}
      HOMEPAGE_STATS_NAVIDROME_SAGAS_USER: ${HOMEPAGE_STATS_NAVIDROME_SAGAS_USER}
      HOMEPAGE_STATS_NAVIDROME_SAGAS_PASSWORD: ${HOMEPAGE_STATS_NAVIDROME_SAGAS_PASSWORD}
      HOMEPAGE_STATS_ADGUARD_USER: ${HOMEPAGE_STATS_ADGUARD_USER}
      HOMEPAGE_STATS_ADGUARD_PASSWORD: ${HOMEPAGE_STATS_ADGUARD_PASSWORD}
      HOMEPAGE_STATS_IMMICH_SERVER_API_KEY: ${HOMEPAGE_STATS_IMMICH_SERVER_API_KEY}
      HOMEPAGE_STATS_PAPERLESS_WEB_TOKEN: ${HOMEPAGE_STATS_PAPERLESS_WEB_TOKEN}
      HOMEPAGE_STATS_MEALIE_TOKEN: ${HOMEPAGE_STATS_MEALIE_TOKEN}
      HOMEPAGE_STATS_QBITTORRENT_USER: ${HOMEPAGE_STATS_QBITTORRENT_USER}
      HOMEPAGE_STATS_QBITTORRENT_PASSWORD: ${HOMEPAGE_STATS_QBITTORRENT_PASSWORD}
    labels:
      traefik-conf.port: ${APOLLON_DASHBOARD_PORT}
      homepage.service: Dashboard

volumes:
  docker-data:
    external: true
