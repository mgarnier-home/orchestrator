name: monitoring

services:
  nodesight:
    extends:
      file: monitoring.yml
      service: nodesight
    environment:
      HOSTNAME: ${ATLAS_HOSTNAME}
      ENABLE_STATS_API: true
      STATS_API_URL: ${STATS_API_URL}
      SERVER_PORT: ${ATLAS_NODESIGHT_PORT}
    labels:
      traefik-conf.port: ${ATLAS_NODESIGHT_PORT}
      traefik-conf.name: nodesight.atlas
    healthcheck:
      test: wget -q --spider --timeout=5 --tries=1 http://localhost:${ATLAS_NODESIGHT_PORT} || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
