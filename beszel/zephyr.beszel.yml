name: beszel

services:
  beszel:
    image: henrygd/beszel:${BESZEL_VERSION}
    container_name: beszel
    restart: unless-stopped
    ports:
      - ${ZEPHYR_BESZEL_PORT}:8090
    volumes:
      - docker-data-beszel:/beszel_data
    labels:
      traefik-conf.port: ${ZEPHYR_BESZEL_PORT}

  beszel-agent:
    image: henrygd/beszel-agent:${BESZEL_VERSION}
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PORT: ${ZEPHYR_BESZEL_AGENT_PORT}
      KEY: ${BESZEL_AGENT_KEY}

volumes:
  docker-data-beszel:
    driver: local
    driver_opts:
      type: none
      device: ${ZEPHYR_DOCKER_DATA}/beszel
      o: bind
