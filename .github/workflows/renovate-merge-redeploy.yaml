    #   github.event.pull_request.base.ref == 'main'
    runs-on: linux/arm64
    steps:
      - name: Install NFS Client
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-common

      - name: Create mount point and mount NFS share
        run: |
          sudo mkdir -p /mnt/orchestrator
          sudo mount -t nfs \
            ${{ secrets.NFS_SERVER }}:${{ secrets.NFS_PATH }} \
            /mnt/orchestrator

      - name: Check if mount is successful
        run: |
          if mountpoint -q /mnt/orchestrator; then
            echo "NFS share mounted successfully."
            ls -l /mnt/orchestrator
          else
            echo "Failed to mount NFS share."
            exit 1
          fi

