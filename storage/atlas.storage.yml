services:
  master:
    image: docker.io/chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    container_name: seaweedfs-master
    restart: unless-stopped
    networks:
      - seaweedfs-net
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: seaweedfs/master
        target: /data
    command: "master -ip=master -ip.bind=0.0.0.0 -metricsPort=9324"
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:9333/cluster/status?pretty=y"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  volume:
    image: docker.io/chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    container_name: seaweedfs-volume
    restart: unless-stopped
    networks:
      - seaweedfs-net
    volumes:
      - type: volume
        source: s3
        volume:
          subpath: data
        target: /data
    command: 'volume -ip=volume -mserver="master:9333" -ip.bind=0.0.0.0 -port=8080 -metricsPort=9325'
    depends_on:
      - master
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  filer:
    image: docker.io/chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    container_name: seaweedfs-filer
    restart: unless-stopped
    networks:
      - seaweedfs-net
    volumes:
      - type: volume
        source: s3
        volume:
          subpath: filer
        target: /data
    command: 'filer -ip=filer -master="master:9333" -ip.bind=0.0.0.0 -metricsPort=9326'
    tty: true
    stdin_open: true
    depends_on:
      - master
      - volume
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  s3:
    image: docker.io/chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    container_name: seaweedfs-s3
    restart: unless-stopped
    networks:
      - seaweedfs-net
    ports:
      - ${ATLAS_S3_PORT}:8333
    labels:
      traefik-conf.port: ${ATLAS_S3_PORT}
      traefik-conf.name: s3
    volumes:
      - type: volume
        source: docker-data
        read_only: true
        volume:
          subpath: seaweedfs/config
        target: /config
    command: 's3 -filer="filer:8888" -ip.bind=0.0.0.0 -metricsPort=9327 -config=/config/s3.json'
    depends_on:
      - master
      - volume
      - filer
    healthcheck:
      # No dedicated /healthz on the S3 gateway (it treats the path as a bucket name and 404s),
      # so we just confirm the HTTP server itself is answering (any non-5xx response, e.g. a 403
      # from a missing signature, still proves it's up).
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/ | grep -qE '^[234]'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  admin:
    image: docker.io/chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    container_name: seaweedfs-admin
    restart: unless-stopped
    networks:
      - seaweedfs-net
    command: 'admin -master="master:9333" -adminUser=${SEAWEEDFS_ADMIN_USER} -adminPassword=${SEAWEEDFS_ADMIN_PASSWORD}'
    ports:
      - ${ATLAS_S3_ADMIN_PORT}:23646
    labels:
      traefik-conf.port: ${ATLAS_S3_ADMIN_PORT}
      traefik-conf.name: s3-admin
    depends_on:
      - master
    healthcheck:
      # Admin UI sits behind a login page, so we just confirm the server answers rather than
      # expecting a clean 200 (which would require valid credentials).
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://localhost:23646/ | grep -qE '^[234]'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  seaweedfs-net:

volumes:
  docker-data:
    external: true
  s3:
    external: true
