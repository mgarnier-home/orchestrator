name: ollama

services:
  # Modèles à télécharger une fois (ils restent dans le volume) :
  #   docker --context athena exec ollama ollama pull <modèle>
  # Utilisés par Paperless : PAPERLESS_AI_LLM_MODEL et PAPERLESS_AI_LLM_EMBEDDING_MODEL
  ollama:
    image: docker.io/ollama/ollama:0.40.19@sha256:7e8c7ba387b11b09dcce1eff1118b1ab433564ed263434a7730c209f2ee346f4
    container_name: ollama
    restart: unless-stopped
    ports:
      - "${ATHENA_OLLAMA_PORT}:11434"
    volumes:
      - type: volume
        source: docker-data-local
        volume:
          subpath: ollama
        target: /root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/root/.ollama/models
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      traefik-conf.port: ${ATHENA_OLLAMA_PORT}
      traefik-conf.name: ollama
      homepage.group: Athena
      homepage.name: Ollama

volumes:
  docker-data-local:
    driver: local
    driver_opts:
      type: none
      device: ${ATHENA_DOCKER_DATA}
      o: bind
