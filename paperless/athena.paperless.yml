name: paperless

services:
  broker:
    image: docker.io/library/redis:8@sha256:0a014ae5c04f55c82aaad2314de411c7a203de1c4312c3e526939226a0185dd9
    container_name: paperless-broker
    restart: unless-stopped
    networks:
      - paperless-net
    healthcheck:
      test: redis-cli ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # labels:
    #   sablier.enable: true
    #   sablier.group: paperless

  db:
    image: docker.io/mariadb:10.11@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
    container_name: paperless-db
    restart: unless-stopped
    user: 1000:1000
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: paperless/db
        target: /var/lib/mysql
    # labels:
    #   sablier.enable: true
    #   sablier.group: paperless
    networks:
      - paperless-net
    environment:
      MARIADB_HOST: paperless
      MYSQL_DATABASE: ${PAPERLESS_DB_NAME}
      MYSQL_USER: ${PAPERLESS_DB_USER}
      MYSQL_PASSWORD: ${PAPERLESS_DB_PASSWD}
      MYSQL_ROOT_PASSWORD: ${PAPERLESS_DB_ROOT_PASSWD}
      MYSQL_LOG_CONSOLE: true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20@sha256:6c86cad803970ea782683a8e80e7403444c5bf3cf70de63b4d3c8e87500db92f
    container_name: paperless-web
    restart: unless-stopped
    networks:
      - paperless-net
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      - ${ATHENA_PAPERLESS_PORT}:8000
    labels:
      traefik-conf.port: ${ATHENA_PAPERLESS_PORT}
      # sablier.enable: true
      # sablier.group: paperless
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: paperless/data
        target: /usr/src/paperless/data
      - type: volume
        source: docker-data
        volume:
          subpath: paperless/media
        target: /usr/src/paperless/media
      - type: volume
        source: docker-data
        volume:
          subpath: paperless/export
        target: /usr/src/paperless/export
      - type: volume
        source: docker-data
        volume:
          subpath: paperless/consume
        target: /usr/src/paperless/consume
    environment:
      PAPERLESS_TIME_ZONE: ${TIMEZONE}
      PAPERLESS_DBENGINE: mariadb
      PAPERLESS_OCR_LANGUAGE: fra
      PAPERLESS_OCR_ROTATE_PAGES: false
      PAPERLESS_TASK_WORKERS: 2
      PAPERLESS_THREADS_PER_WORKER: 2
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: ${PAPERLESS_DB_NAME}
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USER}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWD}
      PAPERLESS_DBPORT: 3306
      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'
      PAPERLESS_ENABLE_HTTP_REMOTE_USER: true
      PAPERLESS_HTTP_REMOTE_USER_HEADER_NAME: HTTP_REMOTE_USER
      PAPERLESS_LOGOUT_REDIRECT_URL: https://authelia.${PUBLIC_DOMAIN_NAME}/logout

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.38@sha256:aa552cc115db488e0f0bcb07446aac13071ad51505b642c84bb894500907b42b
    container_name: paperless-gotenberg
    restart: unless-stopped
    networks:
      - paperless-net
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # labels:
    #   sablier.enable: true
    #   sablier.group: paperless

  tika:
    container_name: paperless-tika
    image: docker.io/apache/tika:3.3.3.0@sha256:326b238b37904c94ff61fed87afe0af72e6a29fa715933b10af97b7d56f1d4cb
    restart: unless-stopped
    networks:
      - paperless-net
    # labels:
    #   sablier.enable: true
    #   sablier.group: paperless
    #   sablier.group.strategy: dynamic
    healthcheck:
      test: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/9998' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  paperless-net:

volumes:
  docker-data:
    external: true
  # docker-data-paperless:
  #   driver: local
  #   driver_opts:
  #     type: none
  #     device: ${ATHENA_DOCKER_DATA}/paperless
  #     o: bind
