name: paperless

services:
  broker:
    image: docker.io/library/redis:8@sha256:56a1737794e36c3ebe8a4544a8ab421af3ab1a6488fb2238aec228c404933fed
    container_name: paperless-broker
    labels:
      homepage.service: Paperless
    restart: unless-stopped
    networks:
      - paperless-net
    healthcheck:
      test: redis-cli ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # labels:
    #   sablier.enable: true
    #   sablier.group: paperless

  db:
    image: docker.io/mariadb:10.11@sha256:e5fe75b2b9de0eb9f6f9a4d9c97272fb3a7480e389ccd487a786bab2a12cc0d7
    container_name: paperless-db
    labels:
      homepage.service: Paperless
    restart: unless-stopped
    user: 1000:1000
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: paperless/db
        target: /var/lib/mysql
    # labels:
    #   sablier.enable: true
    #   sablier.group: paperless
    networks:
      - paperless-net
    environment:
      MARIADB_HOST: paperless
      MYSQL_DATABASE: ${PAPERLESS_DB_NAME}
      MYSQL_USER: ${PAPERLESS_DB_USER}
      MYSQL_PASSWORD: ${PAPERLESS_DB_PASSWD}
      MYSQL_ROOT_PASSWORD: ${PAPERLESS_DB_ROOT_PASSWD}
      MYSQL_LOG_CONSOLE: true
      MARIADB_AUTO_UPGRADE: 1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.5@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
    container_name: paperless-web
    restart: unless-stopped
    networks:
      - paperless-net
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      - ${ATHENA_PAPERLESS_PORT}:8000
    labels:
      homepage.service: Paperless
      homepage.stats: paperless
      traefik-conf.port: ${ATHENA_PAPERLESS_PORT}
      # sablier.enable: true
      # sablier.group: paperless
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: paperless/data
        target: /usr/src/paperless/data
      - type: volume
        source: docker-data
        volume:
          subpath: paperless/media
        target: /usr/src/paperless/media
      - type: volume
        source: docker-data
        volume:
          subpath: paperless/export
        target: /usr/src/paperless/export
      - type: volume
        source: docker-data
        volume:
          subpath: paperless/consume
        target: /usr/src/paperless/consume
    environment:
      PAPERLESS_TIME_ZONE: ${TIMEZONE}
      PAPERLESS_DBENGINE: mariadb
      PAPERLESS_OCR_LANGUAGE: fra
      PAPERLESS_OCR_ROTATE_PAGES: false
      PAPERLESS_TASK_WORKERS: 2
      PAPERLESS_THREADS_PER_WORKER: 2
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: ${PAPERLESS_DB_NAME}
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USER}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWD}
      PAPERLESS_DBPORT: 3306
      PAPERLESS_URL: ${PAPERLESS_URL}
      # Le dashboard interroge les services par IP:port
      PAPERLESS_ALLOWED_HOSTS: ${ATHENA_IP}
      PAPERLESS_FILENAME_FORMAT: "{{ document_type }}/{{ created_year }}/{{ created }} {{ correspondent }} - {{ title }}"
      PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: true
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'
      PAPERLESS_ENABLE_HTTP_REMOTE_USER: true
      PAPERLESS_HTTP_REMOTE_USER_HEADER_NAME: HTTP_REMOTE_USER
      PAPERLESS_LOGOUT_REDIRECT_URL: https://authelia.${PUBLIC_DOMAIN_NAME}/logout
      # Obligatoire depuis la v3
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      # IA native (v3), modèles servis par la stack ollama sur le même hôte
      PAPERLESS_AI_ENABLED: true
      PAPERLESS_AI_LLM_BACKEND: ollama
      PAPERLESS_AI_LLM_ENDPOINT: http://${ATHENA_IP}:${ATHENA_OLLAMA_PORT}
      # Sans phase de réflexion : qwen3.5 renvoyait des réponses vides ou dépassait le délai
      PAPERLESS_AI_LLM_MODEL: ministral-3:8b
      PAPERLESS_AI_LLM_REQUEST_TIMEOUT: 300
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ollama
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: bge-m3

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.40@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
    container_name: paperless-gotenberg
    labels:
      homepage.service: Paperless
    restart: unless-stopped
    networks:
      - paperless-net
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # labels:
    #   sablier.enable: true
    #   sablier.group: paperless

  tika:
    container_name: paperless-tika
    labels:
      homepage.service: Paperless
    image: docker.io/apache/tika:3.4.0.0@sha256:9f3e5bb9da4229a971a4839416b3204499f20668ee834fa741a6a7504bbea7bf
    restart: unless-stopped
    networks:
      - paperless-net
    # labels:
    #   sablier.enable: true
    #   sablier.group: paperless
    #   sablier.group.strategy: dynamic
    healthcheck:
      test: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/9998' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  paperless-net:

volumes:
  docker-data:
    external: true
  # docker-data-paperless:
  #   driver: local
  #   driver_opts:
  #     type: none
  #     device: ${ATHENA_DOCKER_DATA}/paperless
  #     o: bind
