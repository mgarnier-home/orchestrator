name: autoscaler

services:
  autoscaler:
    image: docker.io/mgarnier11/autoscaler:amd64@sha256:5d2783272788838094eec657e6d7a860a41607ca086a0a7640aeaa4430d98c55
    restart: unless-stopped
    container_name: autoscaler
    labels:
      homepage.service: Autoscaler
    environment:
      REGISTRATION_URL: "${REGISTRATION_URL}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      RUNNER_IMAGE: "docker.io/mgarnier11/runner:amd64"
      DOCKER_REGISTRY_URL: "${DOCKER_REGISTRY_URL}"
      DOCKER_REGISTRY_USERNAME: "${DOCKER_REGISTRY_USERNAME}"
      DOCKER_REGISTRY_PASSWORD: "${DOCKER_REGISTRY_PASSWORD}"
      SCALE_SET_NAME: "apollon"
      MAX_RUNNERS: "10"
      MIN_RUNNERS: "2"
      LABELS: "linux/amd64"
      RUNNER_GROUP: "default"
      DOCKER_HOSTS: "unix:///var/run/docker.sock"
      RUNTIME: "sysbox-runc"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
