name: autoscaler

services:
  autoscaler:
    image: docker.io/mgarnier11/autoscaler:1.5.1
    restart: unless-stopped
    container_name: autoscaler
    env_file:
      - ./autoscaler.env
    environment:
      RUNNER_IMAGE: docker.io/mgarnier11/github-runner:latest
      SSH_USER: ${SSH_USER}
      NTFY_SERVER: ${NTFY_SERVER}
      NTFY_TOPIC: ${NTFY_TOPIC}
      SSH_PRIVATE_KEY: ${SSH_PRIVATE_KEY}
      DOCKER_REGISTRY_URL: ${DOCKER_REGISTRY_URL}
      DOCKER_REGISTRY_USERNAME: ${DOCKER_REGISTRY_USERNAME}
      DOCKER_REGISTRY_PASSWORD: ${DOCKER_REGISTRY_PASSWORD}
      RUNTIME: sysbox-runc
    ports:
      - ${APOLLON_AUTOSCALER_PORT}:3000
    labels:
      # traefik-conf.http.routers.autoscaler.rule: Host(`autoscaler.${PUBLIC_DOMAIN_NAME}`)
      # traefik-conf.http.routers.autoscaler.service: apollon_autoscaler
      # traefik-conf.http.routers.autoscaler.entrypoints: https
      # traefik-conf.http.routers.autoscaler.tls.certResolver: tls-resolver
      traefik-conf.port: ${APOLLON_AUTOSCALER_PORT}
      homepage.group: Apollon
      homepage.name: Autoscaler
      homepage.href: https://autoscaler.${PUBLIC_DOMAIN_NAME}
      homepage.siteMonitor: http://${APOLLON_IP}:${APOLLON_AUTOSCALER_PORT}
      traefik-conf.middlewares: github-wl@file,authelia@file
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: autoscaler
        target: /config

volumes:
  docker-data:
    external: true
