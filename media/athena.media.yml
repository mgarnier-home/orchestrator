name: media

services:
  jdownloader:
    container_name: jdownloader
    restart: unless-stopped
    image: jlesage/jdownloader-2:${JDOWNLOADER_VERSION}
    ports:
      - ${ATHENA_JDOWNLOADER_PORT}:5800
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: jdownloader
        target: /config
      - type: volume
        source: atlas-media
        target: /output
    labels:
      traefik-conf.port: ${ATHENA_JDOWNLOADER_PORT}
      # sablier.enable: true
      # sablier.group: downloader
      # sablier.group.strategy: dynamic

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TIMEZONE: ${TIMEZONE}
      # - NVIDIA_VISIBLE_DEVICES=all
      # - JDOWNLOADER_PUBLISHED_SERVER_URL=
    healthcheck:
      test: wget -q --spider --timeout=5 --tries=1 http://localhost:5800 || exit 1
      start_period: 10s

  jellyfin:
    container_name: jellyfin
    restart: unless-stopped
    image: jellyfin/jellyfin:${JELLYFIN_VERSION}
    ports:
      - ${ATHENA_JELLYFIN_PORT}:8096
    labels:
      traefik-conf.port: ${ATHENA_JELLYFIN_PORT}
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TIMEZONE}
      # - NVIDIA_VISIBLE_DEVICES=all
      # - JELLYFIN_PublishedServerUrl=192.168.0.5
    volumes:
      - type: volume
        source: docker-data-local
        volume:
          subpath: jellyfin/config
        target: /config
      - type: volume
        source: docker-data-local
        volume:
          subpath: jellyfin/cache
        target: /cache
      - type: volume
        source: atlas-media
        target: /media
      # - /big-hdd/media:/media
    # group_add:
    #   - 105
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    # security_opt:
    #   - seccomp:unconfined
    healthcheck:
      test: curl -f http://localhost:8096 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  navidrome-music:
    image: deluan/navidrome:${NAVIDROME_VERSION}
    container_name: navidrome-music
    user: 1000:1000 # should be owner of volumes
    ports:
      - ${ATHENA_MEDIA_MUSIC_PORT}:4533
    restart: unless-stopped
    environment:
      # Optional: put your config options customization here. Examples:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      # ND_BASEURL=""
      ND_SPOTIFY_ID: ${SPOTIFY_ID}
      ND_SPOTIFY_SECRET: ${SPOTIFY_SECRET}
      ND_ARTISTARTPRIORITY: external
      ND_REVERSEPROXYWHITELIST: 0.0.0.0/0
      ND_ENABLEUSEREDITING: false
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: navidrome-music
        target: /data
      - type: volume
        source: atlas-media
        volume:
          subpath: musics
        target: /music
        read_only: true
    labels:
      traefik-conf.port: ${ATHENA_MEDIA_MUSIC_PORT}
      traefik-conf.name: music
      my-traefik.http.routers.athena_music_api.rule: Host(`music.${PUBLIC_DOMAIN_NAME}`) && PathPrefix(`/rest/`) && !Query(`c`, `NavidromeUI`)
      my-traefik.http.routers.athena_music_api.service: athena_music
      my-traefik.http.routers.athena_music_api.entrypoints: https
      my-traefik.http.routers.athena_music_api.app.middlewares: authelia-basic@file
      my-traefik.http.routers.athena_music_api.tls.certResolver: tls-resolver

  navidrome-sagas:
    image: deluan/navidrome:${NAVIDROME_VERSION}
    container_name: navidrome-sagas
    user: 1000:1000 # should be owner of volumes
    ports:
      - ${ATHENA_MEDIA_SAGAS_PORT}:4533
    restart: unless-stopped
    environment:
      # Optional: put your config options customization here. Examples:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      # ND_BASEURL=""
      ND_SPOTIFY_ID: ${SPOTIFY_ID}
      ND_SPOTIFY_SECRET: ${SPOTIFY_SECRET}
      ND_REVERSEPROXYWHITELIST: 0.0.0.0/0
      ND_ENABLEUSEREDITING: false
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: navidrome-sagas
        target: /data
      - type: volume
        source: atlas-media
        volume:
          subpath: sagas-mp3
        target: /music
        read_only: true
    labels:
      traefik-conf.port: ${ATHENA_MEDIA_SAGAS_PORT}
      traefik-conf.name: sagas
      my-traefik.http.routers.athena_sagas_api.rule: Host(`sagas.${PUBLIC_DOMAIN_NAME}`) && PathPrefix(`/rest/`) && !Query(`c`, `NavidromeUI`)
      my-traefik.http.routers.athena_sagas_api.service: athena_sagas
      my-traefik.http.routers.athena_sagas_api.entrypoints: https
      my-traefik.http.routers.athena_sagas_api.app.middlewares: authelia-basic@file
      my-traefik.http.routers.athena_sagas_api.tls.certResolver: tls-resolver

  downloader:
    image: registry.gitlab.com/bockiii/deemix-docker
    container_name: downloader
    restart: unless-stopped
    ports:
      - ${ATHENA_DOWNLOADER_PORT}:6595
    labels:
      traefik-conf.port: ${ATHENA_DOWNLOADER_PORT}
      # sablier.enable: true
      # sablier.group: downloader
      # sablier.group.strategy: dynamic
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK_SET: 022
      DEEMIX_SINGLE_USER: true
    volumes:
      - type: volume
        source: atlas-media
        volume:
          subpath: musics
        target: /downloads
      - type: volume
        source: docker-data
        volume:
          subpath: downloader
        target: /config
    healthcheck:
      test: wget -q --spider --timeout=5 --tries=1 http://127.0.0.1:6595 || exit 1
      start_period: 10s

volumes:
  docker-data:
    external: true

  docker-data-local:
    driver: local
    driver_opts:
      type: none
      device: ${ATHENA_DOCKER_DATA}
      o: bind

  atlas-media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=100.64.98.98,rw
      device: :/export/media
