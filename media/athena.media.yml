name: media

services:
  jellyfin:
    container_name: jellyfin
    restart: unless-stopped
    image: docker.io/jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    ports:
      - ${ATHENA_JELLYFIN_PORT}:8096
    labels:
      homepage.service: Jellyfin
      homepage.stats: jellyfin
      traefik-conf.port: ${ATHENA_JELLYFIN_PORT}
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TIMEZONE}
      # - NVIDIA_VISIBLE_DEVICES=all
      # - JELLYFIN_PublishedServerUrl=192.168.0.5
    volumes:
      - type: volume
        source: docker-data-local
        volume:
          subpath: jellyfin/config
        target: /config
      - type: volume
        source: docker-data-local
        volume:
          subpath: jellyfin/cache
        target: /cache
      - type: volume
        source: atlas-media
        target: /media
      # - /big-hdd/media:/media
    # group_add:
    #   - 105
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    # security_opt:
    #   - seccomp:unconfined
    healthcheck:
      test: curl -f http://localhost:8096 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

