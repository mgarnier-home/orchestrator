services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:3d4c4545d51a690a0df15a2ff99038823a88a9822df8e794526447b9afbd7384
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - WEBUI_PORT=8080
    labels:
      homepage.service: qBittorrent
      homepage.stats: qbittorrent
      traefik-conf.port: ${APOLLON_QBITTORRENT_PORT}
    volumes:
      - type: volume
        source: atlas-media
        target: /downloads
    ports:
      - ${APOLLON_QBITTORRENT_PORT}:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

volumes:
  docker-data:
    external: true
  atlas-media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=100.64.98.98,rw
      device: :/export/media
