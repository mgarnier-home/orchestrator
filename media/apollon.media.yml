services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:b024436f8ca665d16d9a997d26fd27fdf867ee5566ba09f32764e7b2976d3e02
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - WEBUI_PORT=8080
    labels:
      traefik-conf.port: ${APOLLON_QBITTORRENT_PORT}
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: media/qbittorrent
        target: /config
      - type: volume
        source: atlas-media
        target: /downloads
    ports:
      - ${APOLLON_QBITTORRENT_PORT}:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

volumes:
  docker-data:
    external: true
  atlas-media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=100.64.98.98,rw
      device: :/export/media
