services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - WEBUI_PORT=8080
    labels:
      homepage.service: qBittorrent
      traefik-conf.port: ${APOLLON_QBITTORRENT_PORT}
    volumes:
      - type: volume
        source: atlas-media
        target: /downloads
    ports:
      - ${APOLLON_QBITTORRENT_PORT}:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

volumes:
  docker-data:
    external: true
  atlas-media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=100.64.98.98,rw
      device: :/export/media
