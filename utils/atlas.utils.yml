name: utils

services:
  dbeaver:
    image: dbeaver/cloudbeaver:latest@sha256:ca5b72170e4247aaa60984d59efe4e979cb29c7ebfd351694fd56aaa1ad03d60
    container_name: dbeaver
    restart: unless-stopped
    ports:
      - ${ATLAS_DBEAVER_PORT}:8978
    labels:
      homepage.service: DBeaver
      traefik-conf.port: ${ATLAS_DBEAVER_PORT}
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: utils/dbeaver
        target: /opt/cloudbeaver

volumes:
  docker-data:
    external: true
