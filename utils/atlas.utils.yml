name: utils

services:
  dbeaver:
    image: dbeaver/cloudbeaver:latest@sha256:7298c59289e9519d8913083c85f3ceb475aa12db0f58e87b6491445a9b298d2c
    container_name: dbeaver
    restart: unless-stopped
    ports:
      - ${ATLAS_DBEAVER_PORT}:8978
    labels:
      traefik-conf.port: ${ATLAS_DBEAVER_PORT}
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: utils/dbeaver
        target: /opt/cloudbeaver

volumes:
  docker-data:
    external: true
