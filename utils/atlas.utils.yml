name: utils

services:
  dbeaver:
    image: dbeaver/cloudbeaver:latest@sha256:c0975db279e488c6f770e4a5a74e7f8d388d5bc53c75bce82647e82cb6358a3f
    container_name: dbeaver
    restart: unless-stopped
    ports:
      - ${ATLAS_DBEAVER_PORT}:8978
    labels:
      traefik-conf.port: ${ATLAS_DBEAVER_PORT}
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: utils/dbeaver
        target: /opt/cloudbeaver

volumes:
  docker-data:
    external: true
