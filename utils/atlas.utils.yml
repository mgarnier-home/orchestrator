name: utils

services:
  dbeaver:
    image: dbeaver/cloudbeaver:latest@sha256:bb4968967796856e3b89e3ece33654d69aaed52113b6bf9d2d2d0056956a4722
    container_name: dbeaver
    restart: unless-stopped
    ports:
      - ${ATLAS_DBEAVER_PORT}:8978
    labels:
      traefik-conf.port: ${ATLAS_DBEAVER_PORT}
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: utils/dbeaver
        target: /opt/cloudbeaver

volumes:
  docker-data:
    external: true
