name: utils

services:
  dbeaver:
    image: dbeaver/cloudbeaver:latest@sha256:c06c1859700bd9202d9d49ebc10ee2512d745997d05e7ca6423267b227af1ca7
    container_name: dbeaver
    restart: unless-stopped
    ports:
      - ${ATLAS_DBEAVER_PORT}:8978
    labels:
      traefik-conf.port: ${ATLAS_DBEAVER_PORT}
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: utils/dbeaver
        target: /opt/cloudbeaver

volumes:
  docker-data:
    external: true
