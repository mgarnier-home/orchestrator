name: utils

services:
  mysql:
    image: mysql:9.7.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: utils/mysql
        target: /var/lib/mysql
    ports:
      - ${ATLAS_MYSQL_PORT}:3306
    # labels:
    #   traefik-conf.port: ${ATLAS_MYSQL_PORT}

  dbeaver:
    image: dbeaver/cloudbeaver:latest@sha256:33083a988e83c714b98bffc58d45c6c6c15c86816bb446c5f053f1eed66d5247
    container_name: dbeaver
    restart: unless-stopped
    ports:
      - ${ATLAS_DBEAVER_PORT}:8978
    labels:
      traefik-conf.port: ${ATLAS_DBEAVER_PORT}
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: utils/dbeaver
        target: /opt/cloudbeaver

volumes:
  docker-data:
    external: true
