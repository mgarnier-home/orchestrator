name: utils

services:
  bg:
    image: docker.io/withoutbg/app:1.3.1@sha256:6aae7b11c45f2ad90fc03a57c98f9e9b80d7edf9e97f66d835ce989e1b52e4cf
    container_name: withoutbg
    restart: unless-stopped
    ports:
      - ${ATHENA_WITHOUTBG_PORT}:80
    labels:
      homepage.service: WithoutBG
      traefik-conf.port: ${ATHENA_WITHOUTBG_PORT}
      sablier.enable: true
      sablier.group: bg
      sablier.group.strategy: dynamic

  samba:
    container_name: samba
    labels:
      homepage.service: Samba
    restart: unless-stopped
    image: docker.io/dperson/samba@sha256:66088b78a19810dd1457a8f39340e95e663c728083efa5fe7dc0d40b2478e869
    environment:
      - USERID=0
      - GROUPID=0
    ports:
      - 445:445/tcp
    command: '-W -s "Share;/share;yes;no;no" -u "${SMB_USER};${SMB_PWD}"'
    volumes:
      - /home/mgarnier:/share/athena-home
      - /hdd-1:/share/hdd-1
      # - /hdd-2:/share/hdd-2
      - /hdd-3:/share/hdd-3
      - /ssd-1:/share/ssd-1
      - /big-hdd:/share/big-hdd
      - /ssd-1/docker-data:/share/docker-data

volumes:
  docker-data:
    external: true
