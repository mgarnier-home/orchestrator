name: utils

services:
  visite:
    image: docker.io/mgarnier11/visite:0.0.3@sha256:7dc801e06eeb5af1a2eee4406fce7f193b5838e579436eada887d20a6d557428
    container_name: visite
    restart: unless-stopped
    ports:
      - ${APOLLON_VISITE_PORT}:3001
    labels:
      homepage.service: Visite
      traefik-conf.port: ${APOLLON_VISITE_PORT}

  valentine:
    image: docker.io/mgarnier11/valentine:latest@sha256:edca091554ab6f67319317de6df1c44f84b47b1e75187caf9b26f1bdcecff11b
    container_name: valentine
    restart: unless-stopped
    ports:
      - ${APOLLON_VALENTINE_PORT}:80
    labels:
      homepage.service: Valentine
      traefik-conf.port: ${APOLLON_VALENTINE_PORT}
      traefik-conf.name: aurelie

  potixx:
    image: docker.io/mgarnier11/potixx:0.0.3@sha256:eeb6e38d2ea37bf889fc8a169e37983c00982218d8eece76390bc8327092f8d1
    container_name: potixx
    restart: unless-stopped
    ports:
      - ${APOLLON_POTIXX_PORT}:8080
    labels:
      homepage.service: Potixx
      traefik-conf.port: ${APOLLON_POTIXX_PORT}
      traefik-conf.http.routers.apollon_potixx_public.rule: Host(`les-potixx.fr`)
      traefik-conf.http.routers.apollon_potixx_public.service: apollon_potixx
      traefik-conf.http.routers.apollon_potixx_public.entrypoints: https
      traefik-conf.http.routers.apollon_potixx_public.tls.certResolver: tls-resolver

  epsilon:
    image: registry.gitlab.com/lgarnier11/epsilon-cms:v1.2.3@sha256:9a8f16fb242b459b19604d728f22e957459259a9c60f48a48ee6164e5895f917
    container_name: epsilon
    restart: unless-stopped
    environment:
      SESSION_SECRET: ${EPSILON_SESSION_SECRET}
      TRUST_PROXY: "1" # Traefik est le seul proxy devant le conteneur
      COOKIE_SECURE: "true"
    ports:
      - ${APOLLON_EPSILON_PORT}:3001
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: utils/epsilon/data
        target: /app/data
      - type: volume
        source: docker-data
        volume:
          subpath: utils/epsilon/uploads
        target: /app/uploads
    labels:
      homepage.service: Epsilon
      traefik-conf.port: ${APOLLON_EPSILON_PORT}
      traefik-conf.http.routers.apollon_epsilon_public.rule: Host(`epsilon44.fr`) || Host(`www.epsilon44.fr`)
      traefik-conf.http.routers.apollon_epsilon_public.service: apollon_epsilon
      traefik-conf.http.routers.apollon_epsilon_public.entrypoints: https
      traefik-conf.http.routers.apollon_epsilon_public.tls.certResolver: tls-resolver

  share:
    image: docker.io/stonith404/pingvin-share:v1.13.0@sha256:6bf2bcd3043ee68cb61264f0857511ccf7f212fdb984382b7f2d491635184ad6
    restart: unless-stopped
    container_name: share
    ports:
      - ${APOLLON_SHARE_PORT}:3000
    labels:
      homepage.service: Share
      traefik-conf.port: ${APOLLON_SHARE_PORT}
    environment:
      - TRUST_PROXY=true # Set to true if a reverse proxy is in front of the container
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: utils/pingvin
        target: /opt/app/backend/data

  pdf:
    image: ghcr.io/alam00000/bentopdf:2.8.11@sha256:b107c37d9f1f27b7edae28d262e526d8e225541a7cc26005b84dbab42c904105
    container_name: bentopdf
    restart: unless-stopped
    ports:
      - ${APOLLON_BENTO_PDF_PORT}:8080
    labels:
      homepage.service: BentoPDF
      traefik-conf.port: ${APOLLON_BENTO_PDF_PORT}
    healthcheck:
      test: wget -q --spider --timeout=5 --tries=1 http://localhost:8080 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  memos:
    image: docker.io/neosmemo/memos:0.31.0@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f
    container_name: memos
    restart: unless-stopped
    ports:
      - ${APOLLON_MEMOS_PORT}:5230
    labels:
      homepage.service: Memos
      homepage.stats: memos
      traefik-conf.port: ${APOLLON_MEMOS_PORT}
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: utils/memos
        target: /var/opt/memos

volumes:
  docker-data:
    external: true
