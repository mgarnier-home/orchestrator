name: network
services:
  sablier:
    image: ghcr.io/sablierapp/sablier:1.21.1@sha256:ceb0b06eca3783991199ce392fa0af74ac28953918f7e558f574a8ca4f4458f8
    container_name: sablier
    restart: unless-stopped
    command:
      - start
      - --provider.name=docker
      - --sessions.default-duration=10m
      - --sessions.expiration-interval=10s
    ports:
      - "${ATHENA_SABLIER_PORT}:10000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: volume
        source: docker-data
        volume:
          subpath: network/sablier
        target: /etc/sablier/themes
    labels:
      homepage.service: Sablier
      traefik-conf.port: ${ATHENA_SABLIER_PORT}

volumes:
  docker-data:
    external: true
