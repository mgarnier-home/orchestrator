name: network

services:
  traefik:
    container_name: traefik
    restart: unless-stopped
    image: traefik:${TRAEFIK_VERSION}
    # image: mgarnier11/my-traefik
    networks:
      traefik-net:
        ipv4_address: 172.19.0.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: volume
        source: docker-data
        volume:
          subpath: traefik/certs
        target: /certs
      - type: volume
        source: docker-data
        volume:
          subpath: traefik/data
        target: /data
    ports:
      - 80:80/tcp # Exposé à l'extérieur via : sudo ufw route allow proto tcp to 172.19.0.2 port 80
      - 443:443/tcp # Exposé à l'extérieur via : sudo ufw route allow proto tcp to 172.19.0.2 port 443
      - ${APOLLON_TRAEFIK_PORT}:8080/tcp
    labels:
      traefik-conf.port: ${APOLLON_TRAEFIK_PORT}
      # traefik-conf.name: traefik.apollon
    env_file:
      - ./traefik.env
    environment:
      TZ: Europe/Paris
      ZEPHYR_IP: ${ZEPHYR_IP}
      APOLLON_IP: ${APOLLON_IP}
      ATHENA_IP: ${ATHENA_IP}
      ATLAS_IP: ${ATLAS_IP}
    depends_on:
      - traefik-conf
    command:
      - --configFile=/data/static.yml
      - --ping=true
    healthcheck:
      test: wget -q --spider --timeout=5 --tries=1 http://localhost:8080/ping || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  traefik-log-dashboard-agent:
    image: hhftechnology/traefik-log-dashboard-agent:${TRAEFIK_LOG_DASHBOARD_AGENT_VERSION}
    container_name: traefik-log-dashboard-agent
    restart: unless-stopped
    networks:
      traefik-net:
        ipv4_address: 172.19.0.5
    depends_on:
      - traefik
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: traefik/data/logs
        target: /logs
        read_only: true
    environment:
      TRAEFIK_LOG_DASHBOARD_ACCESS_PATH: /logs/traefik-access.log
      TRAEFIK_LOG_DASHBOARD_ERROR_PATH: /logs/traefik-access.log
      TRAEFIK_LOG_DASHBOARD_AUTH_TOKEN: ${TRAEFIK_LOG_TOKEN}
      TRAEFIK_LOG_DASHBOARD_SYSTEM_MONITORING: true
      TRAEFIK_LOG_DASHBOARD_LOG_FORMAT: json
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/api/logs/status",
        ]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s

  traefik-log-dashboard:
    image: hhftechnology/traefik-log-dashboard:${TRAEFIK_LOG_DASHBOARD_VERSION}
    container_name: traefik-log-dashboard
    restart: unless-stopped
    networks:
      traefik-net:
        ipv4_address: 172.19.0.6
    depends_on:
      traefik-log-dashboard-agent:
        condition: service_healthy
    ports:
      - ${APOLLON_TRAEFIK_LOG_DASHBOARD_PORT}:3000
    environment:
      AGENT_API_URL: http://traefik-log-dashboard-agent:5000
      AGENT_API_TOKEN: ${TRAEFIK_LOG_TOKEN}
      AGENT_NAME: "Traefik Apollon"
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: traefik/dashboard/positions
        target: /data/positions
      - type: volume
        source: docker-data
        volume:
          subpath: traefik/dashboard/dashboards
        target: /data/dashboards
    labels:
      traefik-conf.port: ${APOLLON_TRAEFIK_LOG_DASHBOARD_PORT}

  authelia:
    image: authelia/authelia:${AUTHELIA_VERSION}
    container_name: authelia
    user: 1000:1000
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: authelia/config
        target: /config
      - type: volume
        source: docker-data
        volume:
          subpath: authelia/logs
        target: /logs
      - type: volume
        source: docker-data
        volume:
          subpath: authelia/secrets
        target: /secrets
    command:
      - authelia
      - --config=/config/configuration.yml
      - --config=/config/oidc.yml
    ports:
      - ${APOLLON_AUTHELIA_PORT}:9091/tcp
    labels:
      my-traefik.http.routers.authelia-ext.rule: Host(`authelia.${PUBLIC_DOMAIN_NAME}`)
      my-traefik.http.routers.authelia-ext.service: apollon_authelia
      my-traefik.http.routers.authelia-ext.entrypoints: https
      my-traefik.http.routers.authelia-ext.tls.certResolver: tls-resolver
      traefik-conf.port: ${APOLLON_AUTHELIA_PORT}
    environment:
      TZ: Europe/Paris
      X_AUTHELIA_CONFIG_FILTERS: template
    networks:
      traefik-net:
        ipv4_address: 172.19.0.4
    restart: unless-stopped

  traefik-conf:
    container_name: traefik-conf
    restart: unless-stopped
    image: mgarnier11/traefik-conf:${TRAEFIK_CONF_VERSION}
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: traefik/conf
        target: /traefik-data
    environment:
      DATA_FILE_PATH: /traefik-data/config.yml
      SERVER_PORT: 3000
      SSH_USER: ${SSH_USER}
      SSH_PRIVATE_KEY: ${SSH_PRIVATE_KEY}
    ports:
      - ${APOLLON_TRAEFIK_CONFIG_PORT}:3000/tcp
    labels:
      traefik-conf.port: ${APOLLON_TRAEFIK_CONFIG_PORT}
    networks:
      traefik-net:
        ipv4_address: 172.19.0.3
    healthcheck:
      test: wget -q --spider --timeout=5 --tries=1 http://localhost:3000 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # infrared:
  #   image: ghcr.io/haveachin/infrared:${INFRARED_VERSION}
  #   container_name: infrared
  #   restart: unless-stopped
  #   networks:
  #     traefik-net:
  #       ipv4_address: 172.19.0.4
  #   ports:
  #     - "25565:25565/tcp" # Exposé à l'extérieur via : sudo ufw route allow proto tcp to 172.19.0.4 port 25565
  #     - ${APOLLON_INFRARED_API_PORT}:8080/tcp
  #   labels:
  #     traefik-conf.port: ${APOLLON_INFRARED_API_PORT}
  #   volumes:
  #     - docker-data-infrared:/configs
  # - type: volume
  #   source: docker-data
  #   volume:
  #     subpath: infrared
  #   target: /configs
  #   environment:
  #     INFRARED_CONFIG_PATH: "/configs"
  #     INFRARED_API_ENABLED: true
  #     INFRARED_API_BIND: 0.0.0.0:8080

networks:
  traefik-net:
    ipam:
      config:
        - subnet: 172.19.0.0/16
          ip_range: 172.19.0.0/24

volumes:
  docker-data:
    external: true
