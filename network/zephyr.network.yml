name: network

services:
  adguard:
    container_name: adguard
    restart: unless-stopped
    image: docker.io/adguard/adguardhome:v0.107.69
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: network/adguard/conf
        target: /opt/adguardhome/conf
      - type: volume
        source: docker-data
        volume:
          subpath: network/adguard/work
        target: /opt/adguardhome/work
    ports:
      - 53:53/tcp
      - 53:53/udp
      - ${ZEPHYR_ADGUARD_PORT}:3000/tcp
    labels:
      traefik-conf.port: ${ZEPHYR_ADGUARD_PORT}
    healthcheck:
      test: wget -q --spider --timeout=5 --tries=1 http://localhost:3000 || exit 1
      start_period: 10s

