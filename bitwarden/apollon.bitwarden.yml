name: bitwarden

services:
  bitwarden:
    image: vaultwarden/server:${BITWARDEN_VERSION}
    container_name: bitwarden
    restart: unless-stopped
    ports:
      - ${APOLLON_BITWARDEN_PORT}:80
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: bitwarden
        target: /data
    labels:
      traefik-conf.port: ${APOLLON_BITWARDEN_PORT}
      # traefik-conf.http.routers.apollon_bitwarden_cert.rule: Host(`bitwarden.${PUBLIC_DOMAIN_NAME}`)
      # traefik-conf.http.routers.apollon_bitwarden_cert.service: apollon_bitwarden
      # traefik-conf.http.routers.apollon_bitwarden_cert.entrypoints: https
      # traefik-conf.http.routers.apollon_bitwarden_cert.app.middlewares: authelia@file
      # traefik-conf.http.routers.apollon_bitwarden_cert.tls.certResolver: tls-resolver
      # traefik-conf.http.routers.apollon_bitwarden_cert.tls.options: ca-mgarnier11@file

volumes:
  docker-data:
    external: true
