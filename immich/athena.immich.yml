name: immich

services:
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:v3.4.0@sha256:7b7b575029168bfb9eb901d868ce7dbfda0d7818e78aaace29b7b8a08cd4e7d5
    networks:
      - immich-net
    # Transcodage NVENC sur la RTX d'athena (hwaccel.transcoding.yml d'Immich, service nvenc)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, video]
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: immich/upload
        target: /usr/src/app/upload
      # Originaux sur le RAID ; aperçus et vidéos 1080p restent sur le SSD (sauvegardé par autosaver)
      - type: volume
        source: atlas-media
        volume:
          subpath: immich-originaux/upload
        target: /usr/src/app/upload/upload
      - type: volume
        source: atlas-media
        volume:
          subpath: immich-originaux/library
        target: /usr/src/app/upload/library
      - /etc/localtime:/etc/localtime:ro
    ports:
      - ${ATHENA_IMMICH_PORT}:2283
    labels:
      homepage.service: Immich
      homepage.stats: immich
      traefik-conf.port: ${ATHENA_IMMICH_PORT}
      traefik-conf.name: immich
      # sablier.enable: true
      # sablier.group: immich
    environment:
      TZ: ${TIMEZONE}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_USERNAME: ${IMMICH_DB_USERNAME}
      DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME}
      DB_HOSTNAME: database
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich-machine-learning
    labels:
      homepage.service: Immich
    # For hardware acceleration, add one of -[armnn, cuda, openvino] to the image tag.
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.0@sha256:f4e7275c9fbd956ed7bccc738ac57890bcbd9f9c17844d2ea0b137e38a083454
    networks:
      - immich-net
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, openvino, openvino-wsl] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    restart: unless-stopped
    healthcheck:
      disable: false
    # labels:
    #   sablier.enable: true
    #   sablier.group: immich

  redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    networks:
      - immich-net
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    labels:
      homepage.service: Immich
    restart: unless-stopped
    # labels:
    #   sablier.enable: true
    #   sablier.group: immich

  database:
    container_name: immich-postgres
    labels:
      homepage.service: Immich
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    user: 1000:1000
    networks:
      - immich-net
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: immich/db
        target: /var/lib/postgresql/data
    shm_size: 128mb
    # labels:
    #   sablier.enable: true
    #   sablier.group: immich
    # healthcheck:
    #   test: >-
    #     pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1;
    #     Chksum="$$(psql --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" --tuples-only --no-align
    #     --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')";
    #     echo "checksum failure count is $$Chksum";
    #     [ "$$Chksum" = '0' ] || exit 1
    #   interval: 5m
    #   start_interval: 30s
    #   start_period: 5m
    # command: >-
    #   postgres
    #   -c shared_preload_libraries=vectors.so
    #   -c 'search_path="$$user", public, vectors'
    #   -c logging_collector=on
    #   -c max_wal_size=2GB
    #   -c shared_buffers=512MB
    #   -c wal_compression=on
    restart: unless-stopped

networks:
  immich-net:

volumes:
  model-cache:
  docker-data:
    external: true
  atlas-media:
    driver: local
    driver_opts:
      type: nfs
      o: addr=100.64.98.98,rw
      device: :/export/media
  # docker-data:
  #   driver: local
  #   driver_opts:
  #     type: none
  #     device: ${ATHENA_DOCKER_DATA}/immich
  #     o: bind
