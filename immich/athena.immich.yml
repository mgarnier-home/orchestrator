name: immich

services:
  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:v2.7.5@sha256:c15bff75068effb03f4355997d03dc7e0fc58720c2b54ad6f7f10d1bc57efaa5
    networks:
      - immich-net
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: immich/upload
        target: /usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    ports:
      - ${ATHENA_IMMICH_PORT}:2283
    labels:
      traefik-conf.port: ${ATHENA_IMMICH_PORT}
      traefik-conf.name: immich
      # sablier.enable: true
      # sablier.group: immich
    environment:
      TZ: ${TIMEZONE}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_USERNAME: ${IMMICH_DB_USERNAME}
      DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME}
      DB_HOSTNAME: database
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich-machine-learning
    # For hardware acceleration, add one of -[armnn, cuda, openvino] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:v2.7.5@sha256:a2501141440f10516d329fdfba2c68082e19eb9ba6016c061ac80d23beadf7f3
    networks:
      - immich-net
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, openvino, openvino-wsl] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    restart: unless-stopped
    healthcheck:
      disable: false
    # labels:
    #   sablier.enable: true
    #   sablier.group: immich

  redis:
    container_name: immich-redis
    image: docker.io/redis:6.2-alpine@sha256:c9ab371a96b057d3642be9bd71cb1b3fe97920d345dc949860578bffb3d54460
    networks:
      - immich-net
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped
    # labels:
    #   sablier.enable: true
    #   sablier.group: immich

  database:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    user: 1000:1000
    networks:
      - immich-net
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: immich/db
        target: /var/lib/postgresql/data
    shm_size: 128mb
    # labels:
    #   sablier.enable: true
    #   sablier.group: immich
    # healthcheck:
    #   test: >-
    #     pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1;
    #     Chksum="$$(psql --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" --tuples-only --no-align
    #     --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')";
    #     echo "checksum failure count is $$Chksum";
    #     [ "$$Chksum" = '0' ] || exit 1
    #   interval: 5m
    #   start_interval: 30s
    #   start_period: 5m
    # command: >-
    #   postgres
    #   -c shared_preload_libraries=vectors.so
    #   -c 'search_path="$$user", public, vectors'
    #   -c logging_collector=on
    #   -c max_wal_size=2GB
    #   -c shared_buffers=512MB
    #   -c wal_compression=on
    restart: unless-stopped

networks:
  immich-net:

volumes:
  model-cache:
  docker-data:
    external: true
  # docker-data:
  #   driver: local
  #   driver_opts:
  #     type: none
  #     device: ${ATHENA_DOCKER_DATA}/immich
  #     o: bind
