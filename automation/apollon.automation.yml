name: automation

services:
  n8n:
    container_name: n8n
    image: docker.io/n8nio/n8n:2.45.4@sha256:80e23ced901f0e22597d4f3464e3aaf9d835372262ea6f08ef760d8ca35df25c
    restart: always
    ports:
      - ${APOLLON_N8N_PORT}:5678
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      traefik-conf.port: ${APOLLON_N8N_PORT}
      traefik-conf.middlewares: github-wl@file,authelia@file
      homepage.group: Apollon
      homepage.name: n8n
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_HOST=n8n.${PUBLIC_DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_PROXY_HOPS=1
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.${PUBLIC_DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${TIMEZONE}
      - TZ=${TIMEZONE}

      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME}
      - DB_POSTGRESDB_USER=${N8N_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}

      # IMPORTANT:
      # Keep the same encryption key from your current installation
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: automation/n8n/files
        target: /files
      - type: volume
        source: docker-data
        volume:
          subpath: automation/n8n/config
        target: /home/node/.n8n
    healthcheck:
      test: wget -q --spider --timeout=5 --tries=1 http://localhost:5678/healthz/readiness || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    container_name: n8n-postgres
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: always
    environment:
      POSTGRES_USER: ${N8N_DB_USER}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: ${N8N_DB_NAME}
      TZ: ${TIMEZONE}
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: automation/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER} -d ${N8N_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  docker-data:
    external: true
