  homepage:
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_VERSION}
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.${PUBLIC_DOMAIN_NAME}
      # PUID: 1000 # optional, your user id
      # PGID: 1000 # optional, your group id
    ports:
      - ${ZEPHYR_HOMEPAGE_PORT}:3000
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: monitoring/homepage/config
        target: /app/config
      - type: volume
        source: docker-data
        volume:
          subpath: monitoring/homepage/images
        target: /app/images
    restart: unless-stopped
    labels:
      traefik-conf.port: ${ZEPHYR_HOMEPAGE_PORT}

