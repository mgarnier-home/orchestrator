name: dashboard

services:
  dashboard:
    container_name: dashboard
    restart: unless-stopped
    image: mgarnier11/dashboard:${DASHBOARD_VERSION}
    environment:
      APP_CONF_PATH: /config/conf.yml
      ICONS_PATH: /config/icons
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: dashboard
        target: /config
    ports:
      - ${ZEPHYR_DASHBOARD_PORT}:3000
    labels:
      traefik-conf.port: ${ZEPHYR_DASHBOARD_PORT}

