name: network

services:
  adguard:
    container_name: adguard
    restart: unless-stopped
    image: adguard/adguardhome:${ADGUARD_VERSION}
    volumes:
      - type: volume
        source: docker-data-adguard
        volume:
          subpath: conf
        target: /opt/adguardhome/conf
      - type: volume
        source: docker-data-adguard
        volume:
          subpath: work
        target: /opt/adguardhome/work
    ports:
      - 53:53/tcp
      - 53:53/udp
      - ${ZEPHYR_ADGUARD_PORT}:3000/tcp
    labels:
      traefik-conf.port: ${ZEPHYR_ADGUARD_PORT}
    healthcheck:
      test: wget -q --spider --timeout=5 --tries=1 http://localhost:3000 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  docker-data-adguard:
    driver: local
    driver_opts:
      type: none
      device: ${ZEPHYR_DOCKER_DATA}/adguard
      o: bind
