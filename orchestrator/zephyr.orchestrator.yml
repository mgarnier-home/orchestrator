name: orchestrator

services:
  orchestrator:
    container_name: orchestrator
    restart: unless-stopped
    image: docker.io/mgarnier11/orchestrator:2.1.0@sha256:a5f8e3cf46e6263901fa67e4d31de805fe857b966f420447d94f93bd001c97e0
    ports:
      - ${ZEPHYR_ORCHESTRATOR_PORT}:3000
    environment:
      ORCHESTRATOR_COMPOSE_DIRECTORY: /compose
      ATHENA_HOST: ssh://${SSH_USER}@${ATHENA_IP}
      ZEPHYR_HOST: ssh://${SSH_USER}@${ZEPHYR_IP}
      APOLLON_HOST: ssh://${SSH_USER}@${APOLLON_IP}
      ATLAS_HOST: ssh://${SSH_USER}@${ATLAS_IP}
      ORCHESTRATOR_SSH_PRIVATE_KEY: ${SSH_PRIVATE_KEY}
    labels:
      traefik-conf.port: ${ZEPHYR_ORCHESTRATOR_PORT}
    volumes:
      - type: volume
        source: docker-data
        volume:
          subpath: orchestrator
        target: /compose

volumes:
  docker-data:
    external: true
