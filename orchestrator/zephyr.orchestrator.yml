name: orchestrator

services:
  orchestrator:
    container_name: orchestrator
    restart: unless-stopped
    image: docker.io/mgarnier11/orchestrator:5.1.0
    ports:
      - ${ZEPHYR_ORCHESTRATOR_PORT}:3000
    environment:
      ATHENA_HOST: ssh://${SSH_USER}@${ATHENA_IP}
      ZEPHYR_HOST: ssh://${SSH_USER}@${ZEPHYR_IP}
      APOLLON_HOST: ssh://${SSH_USER}@${APOLLON_IP}
      ATLAS_HOST: ssh://${SSH_USER}@${ATLAS_IP}
      ORCHESTRATOR_SSH_PRIVATE_KEY: ${SSH_PRIVATE_KEY}
      ORCHESTRATOR_S3_ENDPOINT: ${S3_ENDPOINT}
      ORCHESTRATOR_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      ORCHESTRATOR_S3_SECRET_KEY: ${S3_SECRET_KEY}
      ORCHESTRATOR_S3_BUCKET: environment-bucket
      ORCHESTRATOR_GIT_TOKEN: ${ORCHESTRATOR_GIT_TOKEN}
      ORCHESTRATOR_GIT_REPO: https://github.com/mgarnier-home/orchestrator.git
    labels:
      traefik-conf.port: ${ZEPHYR_ORCHESTRATOR_PORT}
