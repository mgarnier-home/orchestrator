name: backup

services:
  go-autosaver:
    container_name: go-autosaver
    restart: unless-stopped
    image: docker.io/mgarnier11/go-autosaver:1.1.0@sha256:4cc8808a58dccb4656200f2bc09c0e543fa6675678fbc330494295c602de024b
    volumes:
      - docker-data:/backups
      - type: volume
        source: docker-data
        volume:
          subpath: backup/autosaver
        target: /config
    ports:
      - ${ATLAS_AUTOSAVER_PORT}:8080
    labels:
      traefik-conf.port: ${ATLAS_AUTOSAVER_PORT}
      traefik-conf.name: autosaver.atlas
      homepage.group: Atlas
      homepage.name: Autosaver
    privileged: true
    environment:
      CONFIG_FILE_PATH: /config/config-atlas.yml
      # LOG_LEVEL: 5
      NTFY_SERVER: ${NTFY_SERVER}
      NTFY_TOPIC: ${NTFY_TOPIC}
      SSH_PRIVATE_KEY: ${SSH_PRIVATE_KEY}
volumes:
  docker-data:
    external: true
