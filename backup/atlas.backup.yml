name: backup

services:
  go-autosaver:
    container_name: go-autosaver
    restart: unless-stopped
    image: mgarnier11/go-autosaver:${GO_AUTOSAVER_VERSION}
    volumes:
      - docker-data:/backups
      - type: volume
        source: docker-data
        volume:
          subpath: backup/autosaver
        target: /config
    ports:
      - ${ATLAS_AUTOSAVER_PORT}:8080
    labels:
      traefik-conf.port: ${ATLAS_AUTOSAVER_PORT}
      traefik-conf.name: autosaver.atlas
    privileged: true
    environment:
      CONFIG_FILE_PATH: /config/config-atlas.yml
      # LOG_LEVEL: 5
      NTFY_SERVER: ${NTFY_SERVER}
      NTFY_TOPIC: ${NTFY_TOPIC}
      SSH_PRIVATE_KEY: ${SSH_PRIVATE_KEY}
    healthcheck:
      test: wget -q --spider --timeout=5 --tries=1 http://localhost:8080 || exit 1
      start_period: 10s
volumes:
  docker-data:
    external: true
