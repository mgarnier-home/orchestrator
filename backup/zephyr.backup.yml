name: backup

services:
  go-autosaver:
    container_name: go-autosaver
    restart: unless-stopped
    image: mgarnier11/go-autosaver:${GO_AUTOSAVER_VERSION}
    volumes:
      - docker-data:/backups/docker-data-zephyr
      - docker-data-autosaver:/config
    ports:
      - ${ZEPHYR_AUTOSAVER_PORT}:8080
    labels:
      traefik-conf.port: ${ZEPHYR_AUTOSAVER_PORT}
      traefik-conf.name: autosaver.zephyr
    privileged: true
    environment:
      CONFIG_FILE_PATH: /config/config.yml
      # LOG_LEVEL: 5
      NTFY_SERVER: ${NTFY_SERVER}
      NTFY_TOPIC: ${NTFY_TOPIC}
    secrets:
      - ssh_private_key

  cron-runner:
    container_name: cron-runner
    restart: unless-stopped
    image: mgarnier11/cron-runner:${CRON_RUNNER_VERSION}
    volumes:
      - docker-data-cron-runner:/config
    ports:
      - ${ZEPHYR_CRON_RUNNER_PORT}:3000
    labels:
      traefik-conf.port: ${ZEPHYR_CRON_RUNNER_PORT}
    environment:
      LOG_LEVEL: 5
      CRON_CONFIG_PATH: /config/config.yml

volumes:
  docker-data:
    driver: local
    driver_opts:
      type: none
      device: ${ZEPHYR_DOCKER_DATA}
      o: bind

  docker-data-autosaver:
    driver: local
    driver_opts:
      type: none
      device: ${ZEPHYR_DOCKER_DATA}/autosaver
      o: bind

  docker-data-cron-runner:
    driver: local
    driver_opts:
      type: none
      device: ${ZEPHYR_DOCKER_DATA}/cron-runner
      o: bind

secrets:
  ssh_private_key:
    environment: "SSH_PRIVATE_KEY"
